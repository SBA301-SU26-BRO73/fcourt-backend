# Replace fcourt.example with the approved domain before deployment.
server {
    listen 80;
    server_name fcourt.example;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name fcourt.example;
    ssl_certificate /etc/letsencrypt/live/fcourt.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fcourt.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    resolver 127.0.0.11 valid=10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api/internal|actuator)(/|$) {
        return 404;
    }
    location ~ ^/api/auth(/|$) {
        set $upstream http://auth-service:8081;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/super-admin/(users|court-owners)(/|$) {
        set $upstream http://auth-service:8081;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/(subscription-plans|subscriptions|court-types)(/|$) {
        set $upstream http://subscription-service:8082;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/public/branches/[0-9]+$ {
        set $upstream http://facility-service:8083;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/public/(branches|courts)(/|$) {
        set $upstream http://discovery-service:8085;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/admin/(branches|courts)(/|$) {
        set $upstream http://facility-service:8083;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/admin/(dashboard|reports|analytics)(/|$) {
        set $upstream http://reporting-service:8084;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/(admin/)?vouchers(/|$) {
        set $upstream http://voucher-service:8086;
        proxy_pass $upstream$request_uri;
    }
    location = /api/bookings/hold-slots {
        set $upstream http://slot-hold-engine:8087;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/bookings/hold-slots/ {
        set $upstream http://slot-hold-engine:8087;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/(admin/)?bookings(/|$) {
        set $upstream http://booking-service:8088;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/(payments|refunds|admin/payments|admin/refunds)(/|$) {
        set $upstream http://payment-service:8089;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/staff/pos(/|$) {
        set $upstream http://pos-retail-service:8091;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/(staff|admin/staff)(/|$) {
        set $upstream http://staff-operations-service:8090;
        proxy_pass $upstream$request_uri;
    }
    location ~ ^/api/(pos|admin/products|admin/pos)(/|$) {
        set $upstream http://pos-retail-service:8091;
        proxy_pass $upstream$request_uri;
    }
    location / { return 404; }
}
