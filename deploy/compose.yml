name: fcourt-production
x-app: &app
  restart: unless-stopped
  env_file: runtime.env
  networks: [private]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
x-runtime: &runtime
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
    AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
    AUTH_JWT_ISSUER: '${PUBLIC_ORIGIN:?required}'
    AUTH_JWT_AUDIENCE: 'fcourt'
    REDIS_HOST: 'redis'
    REDIS_PORT: '6379'
    REDIS_ADDRESS: 'redis://redis:6379'
    REDIS_PASSWORD: '${REDIS_PASSWORD:?required}'
    SPRING_DATA_REDIS_PASSWORD: '${REDIS_PASSWORD:?required}'
    FACILITY_URL: 'http://facility-service:8083'
    SUBSCRIPTION_BASE_URL: 'http://subscription-service:8082'
    DISCOVERY_URL: 'http://discovery-service:8085'
    BOOKING_URL: 'http://booking-service:8088'
    HOLD_URL: 'http://slot-hold-engine:8087'
    AUTH_URL: 'http://auth-service:8081'
    STAFF_URL: 'http://staff-operations-service:8090'
    HOLD_GRPC_TARGET: 'slot-hold-engine:9087'
    BOOKING_GRPC_TARGET: 'booking-service:9088'
    STAFF_GRPC_PLAINTEXT: 'true'
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: 'never'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    networks: [private]
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [private]
  auth-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/auth-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8081'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/auth_db'
      SPRING_DATASOURCE_USERNAME: 'auth'
      SPRING_DATASOURCE_PASSWORD: '${APP_DB_PASSWORD:?required}'
  subscription-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/subscription-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8082'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/subscription_db'
      SPRING_DATASOURCE_USERNAME: 'subscription'
      SPRING_DATASOURCE_PASSWORD: '${APP_DB_PASSWORD:?required}'
  facility-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/facility-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
