name: fcourt-production
x-app: &app
  restart: unless-stopped
  networks: [private]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
x-runtime: &runtime
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
    AUTH_JWK_SET_URI: 'http://auth-service:8081/.well-known/jwks.json'
    AUTH_JWT_ISSUER: '${PUBLIC_ORIGIN:?required}'
    AUTH_JWT_AUDIENCE: 'fcourt'
    REDIS_HOST: 'redis'
    REDIS_PORT: '6379'
    REDIS_ADDRESS: 'redis://redis:6379'
    REDIS_PASSWORD: '${REDIS_PASSWORD:?required}'
    SPRING_DATA_REDIS_PASSWORD: '${REDIS_PASSWORD:?required}'
    FACILITY_URL: 'http://facility-service:8083'
    SUBSCRIPTION_BASE_URL: 'http://subscription-service:8082'
    DISCOVERY_URL: 'http://discovery-service:8085'
    BOOKING_URL: 'http://booking-service:8088'
    HOLD_URL: 'http://slot-hold-engine:8087'
    AUTH_URL: 'http://auth-service:8081'
    STAFF_URL: 'http://staff-operations-service:8090'
    HOLD_GRPC_TARGET: 'slot-hold-engine:9087'
    BOOKING_GRPC_TARGET: 'booking-service:9088'
    STAFF_GRPC_PLAINTEXT: 'false'
    POS_URL: 'http://pos-retail-service:8091'
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: 'never'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?required}
      FACILITY_DB_PASSWORD: ${FACILITY_DB_PASSWORD:?required}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?required}
      DISCOVERY_DB_PASSWORD: ${DISCOVERY_DB_PASSWORD:?required}
      VOUCHER_DB_PASSWORD: ${VOUCHER_DB_PASSWORD:?required}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?required}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?required}
      STAFF_DB_PASSWORD: ${STAFF_DB_PASSWORD:?required}
      POS_DB_PASSWORD: ${POS_DB_PASSWORD:?required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
      - ./rotate-database-passwords.sh:/opt/fcourt/rotate-database-passwords.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    networks: [private]
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [private]
  auth-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/auth-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-}
      AUTH_CLOUDINARY_URL: ${AUTH_CLOUDINARY_URL:-}
      SERVER_PORT: '8081'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/auth_db'
      SPRING_DATASOURCE_USERNAME: 'auth'
      SPRING_DATASOURCE_PASSWORD: '${AUTH_DB_PASSWORD:?required}'
  subscription-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/subscription-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
      SERVER_PORT: '8082'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/subscription_db'
      SPRING_DATASOURCE_USERNAME: 'subscription'
      SPRING_DATASOURCE_PASSWORD: '${SUBSCRIPTION_DB_PASSWORD:?required}'
  facility-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/facility-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8083'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/facility_db'
      SPRING_DATASOURCE_USERNAME: 'facility'
      SPRING_DATASOURCE_PASSWORD: '${FACILITY_DB_PASSWORD:?required}'
  reporting-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/reporting-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8084'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/reporting_db'
      SPRING_DATASOURCE_USERNAME: 'reporting'
      SPRING_DATASOURCE_PASSWORD: '${REPORTING_DB_PASSWORD:?required}'
  discovery-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/discovery-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8085'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/discovery_db'
      SPRING_DATASOURCE_USERNAME: 'discovery'
      SPRING_DATASOURCE_PASSWORD: '${DISCOVERY_DB_PASSWORD:?required}'
  voucher-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/voucher-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8086'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/voucher_db'
      SPRING_DATASOURCE_USERNAME: 'voucher'
      SPRING_DATASOURCE_PASSWORD: '${VOUCHER_DB_PASSWORD:?required}'
  slot-hold-engine:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/slot-hold-engine:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      BOOKING_HOLD_SERVICE_TOKEN: ${BOOKING_HOLD_SERVICE_TOKEN:-}
      SERVER_PORT: '8087'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
  booking-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/booking-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      BOOKING_HOLD_SERVICE_TOKEN: ${BOOKING_HOLD_SERVICE_TOKEN:-}
      POS_BOOKING_SERVICE_TOKEN: ${POS_BOOKING_SERVICE_TOKEN:-}
      POS_SETTLEMENT_SERVICE_TOKEN: ${POS_SETTLEMENT_SERVICE_TOKEN:-}
      SERVER_PORT: '8088'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/booking_db'
      SPRING_DATASOURCE_USERNAME: 'booking'
      SPRING_DATASOURCE_PASSWORD: '${BOOKING_DB_PASSWORD:?required}'
  payment-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/payment-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      SERVER_PORT: '8089'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/payment_db'
      SPRING_DATASOURCE_USERNAME: 'payment'
      SPRING_DATASOURCE_PASSWORD: '${PAYMENT_DB_PASSWORD:?required}'
  staff-operations-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/staff-operations-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      SERVER_PORT: '8090'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/staff_db'
      SPRING_DATASOURCE_USERNAME: 'staff'
      SPRING_DATASOURCE_PASSWORD: '${STAFF_DB_PASSWORD:?required}'
  pos-retail-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/pos-retail-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      POS_BOOKING_SERVICE_TOKEN: ${POS_BOOKING_SERVICE_TOKEN:-}
      POS_SETTLEMENT_SERVICE_TOKEN: ${POS_SETTLEMENT_SERVICE_TOKEN:-}
      SERVER_PORT: '8091'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/pos_retail_db'
      SPRING_DATASOURCE_USERNAME: 'pos'
      SPRING_DATASOURCE_PASSWORD: '${POS_DB_PASSWORD:?required}'
  notification-service:
    <<: *app
    image: ${IMAGE_PREFIX:?required}/notification-service:${RELEASE_TAG:?required}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    environment:
      <<: *runtime
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-}
      NOTIFICATION_SMTP_USER: ${NOTIFICATION_SMTP_USER:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_MAIL_FROM: ${NOTIFICATION_MAIL_FROM:-}
      NOTIFICATION_RESET_PASSWORD_URL: ${NOTIFICATION_RESET_PASSWORD_URL:-}
      SERVER_PORT: '8092'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/notification_db'
      SPRING_DATASOURCE_USERNAME: 'notification'
      SPRING_DATASOURCE_PASSWORD: '${NOTIFICATION_DB_PASSWORD:?required}'
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/letsencrypt:ro
      - ./acme:/var/www/acme:ro
    networks: [private]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
networks:
  private:
