server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: discovery-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6387}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
  datasource:
    url: ${DISCOVERY_DB_URL:jdbc:postgresql://localhost:5432/discovery_db}
    username: ${DISCOVERY_DB_USER:postgres}
    password: ${DISCOVERY_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jdbc:
    template:
      query-timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: discovery-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      missing-topics-fatal: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  jackson:
    deserialization:
      fail-on-null-for-primitives: true
      accept-float-as-int: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
discovery:
  auth:
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    audience: ${AUTH_JWT_AUDIENCE:fcourt}
    base-url: ${AUTH_URL:http://localhost:8081}
  reviews:
    images:
      max-file-bytes: 5242880
      cloudinary:
        url: ${CLOUDINARY_URL:}
        cloud-name: ${CLOUDINARY_CLOUD_NAME:}
        api-key: ${CLOUDINARY_API_KEY:}
        api-secret: ${CLOUDINARY_API_SECRET:}
  internal:
    slot-token: ${DISCOVERY_INTERNAL_SLOT_TOKEN:}
  slots:
    facility-url: ${FACILITY_URL:http://localhost:8083}
    booking-url: ${BOOKING_URL:http://localhost:8088}
  search:
    cache-ttl-seconds: ${DISCOVERY_CACHE_TTL_SECONDS:5}
  kafka:
    branch-topic: ${BRANCH_UPDATED_TOPIC:facility.branch-updated.v1}
