server:
  port: ${SERVER_PORT:8761}
spring:
  application:
    name: eureka-server
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Standalone registry: it neither registers with itself nor fetches a registry from a peer.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Dev/standalone: do not stop evicting when few heartbeats arrive, and start serving immediately.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    wait-time-in-ms-when-sync-empty: 0
management:
  endpoints:
    web:
      exposure:
        include: health
