services:
  pos-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pos_retail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POS_DATABASE_PASSWORD:?set POS_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${POS_DATABASE_PORT:-5491}:5432"
    volumes:
      - pos_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_retail_db"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pos_database:
