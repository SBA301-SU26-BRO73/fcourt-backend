server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: slot-hold-engine
  mvc:
    problemdetails:
      enabled: true
hold:
  redis-address: ${REDIS_ADDRESS:redis://localhost:6387}
  redis-password: ${REDIS_PASSWORD:}
  discovery-url: ${DISCOVERY_URL:http://localhost:8085}
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  paths-to-exclude: /api/internal/**,/error
