server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: slot-hold-engine
  mvc:
    problemdetails:
      enabled: true
hold:
  redis-address: ${REDIS_ADDRESS:redis://localhost:6387}
  redis-password: ${REDIS_PASSWORD:}
  discovery-url: ${DISCOVERY_URL:http://localhost:8085}
management:
  endpoints:
    web:
      exposure:
        include: health
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
