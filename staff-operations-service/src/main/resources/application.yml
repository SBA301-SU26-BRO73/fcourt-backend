server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: staff-operations-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${STAFF_DATABASE_URL:jdbc:postgresql://localhost:5490/staff_db}
    username: ${STAFF_DATABASE_USER:postgres}
    password: ${STAFF_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000

staff:
  time-zone: ${STAFF_TIME_ZONE:Asia/Ho_Chi_Minh}
  booking:
    url: ${BOOKING_URL:http://localhost:8088}
  discovery:
    url: ${DISCOVERY_URL:http://localhost:8085}
  events:
    enabled: ${STAFF_EVENTS_ENABLED:true}
    topic: ${STAFF_EVENTS_TOPIC:fcourt.staff.events}
  auth:
    url: ${AUTH_URL:http://localhost:8081}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    audience: ${AUTH_JWT_AUDIENCE:fcourt}
  facility:
    url: ${FACILITY_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
