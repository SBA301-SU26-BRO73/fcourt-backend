name: voucher-service
on:
  pull_request:
    branches: [dev, "feature/**"]
    paths: ["voucher-service/**", ".github/workflows/voucher-service.yml"]
  push:
    branches: ["feature/**"]
    paths: ["voucher-service/**", ".github/workflows/voucher-service.yml"]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voucher-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: voucher-service/pom.xml
      - run: sh mvnw -B -ntp clean verify
