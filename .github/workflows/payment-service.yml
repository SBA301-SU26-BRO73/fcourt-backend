name: payment-service
on:
  pull_request:
    branches: [dev, "feature/**", "feat/**"]
    paths: ["payment-service/**", ".github/workflows/payment-service.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: payment-service/pom.xml
      - run: sh mvnw -B -ntp clean verify
