name: production smoke runner
on:
  pull_request:
    paths: ['tools/production_smoke/**', '.github/workflows/production-smoke-runner.yml']
  push:
    branches: ['test/scrum-107-*']
    paths: ['tools/production_smoke/**', '.github/workflows/production-smoke-runner.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/production_smoke -v
