name: slot-hold-engine
on:
  pull_request:
    branches: [dev, "feature/**"]
    paths: ["slot-hold-engine/**", ".github/workflows/slot-hold-engine.yml"]
  push:
    branches: ["feature/**"]
    paths: ["slot-hold-engine/**", ".github/workflows/slot-hold-engine.yml"]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slot-hold-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: slot-hold-engine/pom.xml
      - run: sh mvnw -B -ntp clean verify
