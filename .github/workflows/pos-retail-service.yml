name: POS retail verification
on:
  pull_request:
    paths:
      - 'pos-retail-service/**'
      - '.github/workflows/pos-retail-service.yml'
  push:
    branches: [dev]
    paths:
      - 'pos-retail-service/**'
      - '.github/workflows/pos-retail-service.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pos-retail-service/pom.xml
      - run: mvn -B -ntp -f pos-retail-service/pom.xml clean verify
