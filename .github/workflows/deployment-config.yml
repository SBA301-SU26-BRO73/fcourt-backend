name: deployment-config
on:
  pull_request:
    branches: [dev]
    paths: ['deploy/**', '.github/workflows/deployment-config.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy -v
      - run: sh -n deploy/backup.sh deploy/init-databases.sh
