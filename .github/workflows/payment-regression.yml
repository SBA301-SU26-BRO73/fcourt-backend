name: payment-regression
on:
  pull_request:
    branches: [dev]
    paths: ['tools/payment_regression/**', '.github/workflows/payment-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - run: python -m unittest discover -s tools/payment_regression -v
      - run: python tools/payment_regression/run.py --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-payment-regression-evidence
          path: target/payment-regression/report.json
