name: discovery-service
on:
  pull_request:
    branches: [dev]
    paths: ["discovery-service/**", ".github/workflows/discovery-service.yml"]
  push:
    branches: ["feature/**"]
    paths: ["discovery-service/**", ".github/workflows/discovery-service.yml"]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discovery-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: discovery-service/pom.xml
      - run: sh mvnw -B -ntp verify
