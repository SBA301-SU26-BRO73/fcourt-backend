name: booking-support
on:
  pull_request:
    paths:
      - 'booking-service/**'
      - '.github/workflows/booking-support.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: booking-service/pom.xml
      - run: mvn -B -f booking-service/pom.xml verify
