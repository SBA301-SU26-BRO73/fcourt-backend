services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voucher_db
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5486:5432"
    volumes:
      - voucher_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d voucher_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  voucher_data:
