map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    # Largest multipart request is facility-service's 55 MiB limit (facility-service/src/main/resources/application.yml:22-25).
    client_max_body_size 60m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /_gateway_health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok";
    }

    # Route families follow the reviewed draft deploy/nginx.conf:22-85 on origin/feature/minh-scrum-100-production-deployment.
    # Flutter paths: fcourt-flutter/lib/features/catalog/data/datasources/catalog_remote_data_source.dart:14-15;
    # auth: fcourt-flutter/lib/features/auth/data/datasources/auth_remote_data_source.dart:14,19-22.
    location ~ ^/(api/internal|actuator)(/|$) { return 404; }
    location ~ ^/api/auth(/|$) { proxy_pass http://auth-service:8081; }
    # Owners: auth auth-service/src/main/java/com/fcourt/auth/superadmin/SuperAdminController.java:20 and
    # PlatformStatsController.java:17; subscription subscription-service/src/main/java/com/fcourt/subscription/stats/SaasRevenueController.java:13;
    # reporting reporting-service/src/main/java/com/fcourt/reporting/api/SuperAdminDashboardController.java:22.
    location ~ ^/api/super-admin/(court-admins|users|stats/accounts|stats/owner-names)(/|$) { proxy_pass http://auth-service:8081; }
    location ~ ^/api/super-admin/stats/saas-revenue(/|$) { proxy_pass http://subscription-service:8082; }
    location ~ ^/api/super-admin/dashboard(/|$) { proxy_pass http://reporting-service:8084; }
    location ~ ^/api/(subscription-plans|subscriptions|court-types)(/|$) { proxy_pass http://subscription-service:8082; }
    # Facility owns public branch images (facility-service/src/main/java/com/fcourt/facility/api/BranchImageController.java:54)
    # and staff branch/court reads (BranchController.java:72, CourtController.java:32,72 in the same package).
    location ~ ^/api/public/branches/[0-9]+/images(/|$) { proxy_pass http://facility-service:8083; }
    location ~ ^/api/public/branches/[0-9]+$ { proxy_pass http://facility-service:8083; }
    location ~ ^/api/public/(branches|courts)(/|$) { proxy_pass http://discovery-service:8085; }
    # Discovery owns public reviews (discovery-service/src/main/java/com/fcourt/discovery/controller/ReviewController.java:32)
    # and review write/reply routes in that controller.
    location ~ ^/api/(reviews|admin/reviews)(/|$) { proxy_pass http://discovery-service:8085; }
    location ~ ^/api/admin/(branches|courts)(/|$) { proxy_pass http://facility-service:8083; }
    location ~ ^/api/staff/(branches|courts)(/|$) { proxy_pass http://facility-service:8083; }
    location ~ ^/api/admin/(dashboard|reports|analytics)(/|$) { proxy_pass http://reporting-service:8084; }
    location ~ ^/api/(admin/)?vouchers(/|$) { proxy_pass http://voucher-service:8086; }
    location ~ ^/api/bookings/hold-slots(/|$) { proxy_pass http://slot-hold-engine:8087; }
    location ~ ^/api/(admin/)?bookings(/|$) { proxy_pass http://booking-service:8088; }
    location ~ ^/api/(payments|refunds|admin/payments|admin/refunds)(/|$) { proxy_pass http://payment-service:8089; }
    location ~ ^/api/staff/pos(/|$) { proxy_pass http://pos-retail-service:8091; }
    location ~ ^/api/(staff|admin/staff)(/|$) { proxy_pass http://staff-operations-service:8090; }
    location ~ ^/api/(pos|admin/products|admin/pos)(/|$) { proxy_pass http://pos-retail-service:8091; }
    location / { return 404; }
}

# Android dev config API_BASE_URL is in fcourt-flutter/env/dev.json:3; the requested
# ws-fcourt socket address is ws://10.0.2.2:8088/ws-fcourt. The backend's
# booking-service application.yml:2 declares HTTP port 8088; this forwards the
# requested websocket path to it. Socket handler support/path is not found in
# backend sources and must be checked by the person running the stack.
server {
    listen 8088;
    proxy_connect_timeout 5s;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location = /ws-fcourt { proxy_pass http://booking-service:8088; }
    location / { return 404; }
}
